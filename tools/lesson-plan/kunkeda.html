        if (window.parent && window.parent !== window) {
          window.parent.postMessage(
            Object.assign({ source: "campus-lesson-plan", type: "status" }, payload),
            window.location.origin
          );
        }
      } catch (e) {}
    }

    function collectUiState() {
      return {
        courseName: courseNameInput ? courseNameInput.value : "",
        examType: examTypeInput ? examTypeInput.value : "",
        courseCode: courseCodeInput ? courseCodeInput.value : "",
        className: classNameInput ? classNameInput.value : "",
        aiGenScope: aiGenScope ? aiGenScope.value : "full",
        lessons: lessons.slice(),
        generatedHtml: generatedHtml || "",
        step: lpCurrentStep,
        log: logBox ? logBox.textContent : "",
        progress: progressFill ? parseInt(String(progressFill.style.width || "0"), 10) || 0 : 0,
        modelValue: modelNameInput ? modelNameInput.value : "",
      };
    }

    function saveLessonState() {
      try {
        sessionStorage.setItem(LP_STATE_KEY, JSON.stringify(collectUiState()));
      } catch (e) {}
    }

    function restoreLessonState() {
      try {
        const raw = sessionStorage.getItem(LP_STATE_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (!s || typeof s !== "object") return;
        if (courseNameInput && s.courseName != null) courseNameInput.value = s.courseName;
        if (examTypeInput && s.examType) examTypeInput.value = s.examType;
        if (courseCodeInput && s.courseCode != null) courseCodeInput.value = s.courseCode;
        if (classNameInput && s.className != null) classNameInput.value = s.className;
        if (aiGenScope && s.aiGenScope) aiGenScope.value = s.aiGenScope;
        if (Array.isArray(s.lessons) && s.lessons.length) {
          lessons = s.lessons.slice();
          renderLessonList();
        }
        if (s.generatedHtml) {
          generatedHtml = s.generatedHtml;
          setPreviewHtml(generatedHtml);
        }
        if (s.step === 2) setStep(2, true);
        if (logBox && s.log) logBox.textContent = s.log;
        if (typeof s.progress === "number") setProgress(s.progress);

          window.setTimeout(function () {
            modelNameInput.value = s.modelValue;

        }
      } catch (e) {}

        const txt = normalizeText(td.textContent);

          const row = td.closest("tr");
          if (!row) {
            continue;
          }
          const cells = Array.from(row.children).filter((el) => el.tagName === "TD");
          const index = cells.indexOf(td);
          if (index >= 0 && index < cells.length - 1) {
            return cells[index + 1];
          }
        }
      }
      return null;
    }

    function aiFieldToString(value) {
      if (value == null) {
        return "";
      }
      if (typeof value === "string") {
        return value;
      }
      if (typeof value === "number" || typeof value === "boolean") {
        return String(value);
      }
      if (Array.isArray(value)) {
        return value
          .map((item) => aiFieldToString(item))
          .filter((line) => String(line).trim().length > 0)
          .join("\n");
      }
      if (typeof value === "object") {
        try {
          return JSON.stringify(value, null, 2);
        } catch (e) {
          return String(value);
        }
      }
      return String(value);
    }

    function setCellText(cell, value) {
      if (!cell) {

      cell.innerHTML = '<p class="western" align="center"><font face="宋体"><span lang="zh-CN"><font size="3" style="font-size:12pt;color:#00b0f0;">' +
        s.replace(/</g, "&lt;").replace(/>/g, "&gt;") +

    function setLongTextCell(cell, value) {
      if (!cell) {

      const safeText = aiFieldToString(value).replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const lines = safeText.split("\n").filter((line) => line.trim().length > 0);
      if (lines.length === 0) {
        cell.innerHTML = '<p class="western" align="left"><br/></p>';

        .map((line) => '<p class="western" align="left"><font face="宋体"><span lang="zh-CN"><font size="3" style="font-size:12pt;color:#111827;">' + line + "</font></span></font></p>")

    function processBlockIsMeaningful(block) {
      if (!block || typeof block !== "object") {
        return false;
      }
      const pick = (v) => (typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim());
      return !!(
        pick(block.stage) ||

        pick(block.teacherActivity) ||

    function cellLooksBareForAggregate(cell) {
      if (!cell) {

    function processDetailRowColsBare(row) {
      const tds = row.querySelectorAll("td");
      if (!tds || tds.length < 4) {
        return true;
      }
      return (
        cellLooksBareForAggregate(tds[1]) &&

      );

    /** 将一段长文拆成 bucketCount 份，用于教学过程表中「有 duration 但三列仍空」时的兜底。 */
    function splitTextForEvenBuckets(text, bucketCount) {
      const t = aiFieldToString(text).trim();
      if (!t || bucketCount < 1) {
        return Array.from({ length: Math.max(0, bucketCount) }, () => "");
      }
      let parts = t
        .split(/(?<=[。！？!?;；])\s+/)
        .map((x) => x.trim())
        .filter(Boolean);
      if (parts.length < 2) {
        parts = t.split(/\r?\n+/).map((x) => x.trim()).filter(Boolean);
      }
      if (!parts.length) {
        parts = [t];
      }
      const out = Array.from({ length: bucketCount }, () => "");
      if (parts.length >= bucketCount) {
        parts.forEach((s, idx) => {
          const b = idx % bucketCount;
          out[b] = out[b] ? out[b] + " " + s : s;
        });
        return out;
      }
      if (t.length > 200 && bucketCount > 1) {
        const chunk = Math.ceil(t.length / bucketCount);
        for (let i = 0; i < bucketCount; i += 1) {
          out[i] = t.slice(i * chunk, (i + 1) * chunk).trim();
        }
        return out;
      }
      parts.forEach((s, idx) => {
        const b = idx % bucketCount;
        out[b] = out[b] ? out[b] + " " + s : s;
      });
      return out;
    }

    function fillEmptyProcessDetailRowsFromAggregates(processTable, lessonData) {
      if (!processTable || !lessonData) {
        return;
      }
      const rows = Array.from(processTable.querySelectorAll("tr"));
      if (rows.length < 10) {
        return;
      }
      const detailRows = rows.slice(2, 9);
      const bareIdx = [];
      for (let i = 0; i < detailRows.length; i += 1) {
        if (processDetailRowColsBare(detailRows[i])) {
          bareIdx.push(i);
        }
      }
      if (bareIdx.length === 0) {
        return;
      }
      const ta = aiFieldToString(lessonData.teacherActivities).trim();
      const sa = aiFieldToString(lessonData.studentActivities).trim();
      const di = aiFieldToString(lessonData.designIntent).trim();
      if (!ta && !sa && !di) {
        return;
      }
      const n = bareIdx.length;
      const bucketsT = splitTextForEvenBuckets(ta, n);
      const bucketsS = splitTextForEvenBuckets(sa, n);
      const bucketsD = splitTextForEvenBuckets(di, n);
      bareIdx.forEach((detailIndex, j) => {
        const row = detailRows[detailIndex];
        const tds = row.querySelectorAll("td");
        if (!tds || tds.length < 4) {
          return;
        }
        let t = bucketsT[j] || "";
        let s = bucketsS[j] || "";
        let d = bucketsD[j] || "";
        if (!t && !s && !d && n === 1) {
          t = ta;
          s = sa;
          d = di;
        }
        if (t) {
          setLongTextCell(tds[1], t);
        }
        if (s) {
          setLongTextCell(tds[2], s);
        }
        if (d) {
          setLongTextCell(tds[3], d);
        }
      });
    }

      const colors = ["#cc785c", "#a9583e", "#5db8a6", "#e8a55a", "#5db872", "#c64545", "#6c6a64", "#252320"];
      const count = 52;

    function findDetailedSectionPairs(documentObj) {
      const sections = Array.from(documentObj.querySelectorAll("body > div"));
      const pairs = [];
      for (let i = 0; i < sections.length; i += 1) {
        const current = sections[i];
        if (!current) {
          continue;
        }
        if (!normalizeText(current.textContent).includes(normalizeText("学时详细教案"))) {
          continue;
        }
        const join = current.querySelector(":scope > .lesson-sheet-join");
        if (join) {
          const tbs = join.querySelectorAll(":scope > table");
          if (tbs.length >= 2 && normalizeText(tbs[1].textContent).includes(normalizeText("教学过程"))) {
            pairs.push({ lessonDiv: current, processDiv: join });
            continue;
          }
        }
        const next = sections[i + 1];
        if (next && normalizeText(next.textContent).includes(normalizeText("教学过程"))) {
          pairs.push({ lessonDiv: current, processDiv: next });
        }
      }
      return pairs;
    }

    function getLessonAndProcessTables(pair) {
      const join = pair.lessonDiv.querySelector(":scope > .lesson-sheet-join");
      if (join && pair.processDiv === join) {
        const tbs = join.querySelectorAll(":scope > table");
        if (tbs.length >= 2) {
          return { lessonTable: tbs[0], processTable: tbs[1] };
        }
      }
      return {
        lessonTable: pair.lessonDiv.querySelector("table"),
        processTable: pair.processDiv.querySelector("table")
      };

    function getCellByLabelInTable(table, labelText) {
      const tds = Array.from(table.querySelectorAll("td"));
      for (const td of tds) {
        const txt = normalizeText(td.textContent);
        if (txt.includes(normalizeText(labelText))) {
          const row = td.closest("tr");
          if (!row) {
            continue;
          }
          const cells = Array.from(row.children).filter((el) => el.tagName === "TD");
          const index = cells.indexOf(td);
          if (index >= 0 && index < cells.length - 1) {
            return cells[index + 1];
          }
        }
      }
      return null;
    }

    function ensureDetailedPairs(documentObj, targetCount) {
      let pairs = findDetailedSectionPairs(documentObj);
      while (pairs.length < targetCount && pairs.length > 0) {
        const last = pairs[pairs.length - 1];
        const merged = last.lessonDiv.contains(last.processDiv);
        const lessonClone = last.lessonDiv.cloneNode(true);
        if (merged) {
          lessonClone.id = "Section" + (100 + pairs.length * 2);
          last.lessonDiv.parentNode.insertBefore(lessonClone, last.lessonDiv.nextSibling);
        } else {
          const processClone = last.processDiv.cloneNode(true);
          lessonClone.id = "Section" + (100 + pairs.length * 2);
          processClone.id = "Section" + (101 + pairs.length * 2);
          last.processDiv.after(lessonClone, processClone);
        }
        pairs = findDetailedSectionPairs(documentObj);
      }
      while (pairs.length > targetCount && pairs.length > 0) {
        const last = pairs[pairs.length - 1];
        last.lessonDiv.remove();
        if (!last.lessonDiv.contains(last.processDiv)) {
          last.processDiv.remove();
        }
        pairs = findDetailedSectionPairs(documentObj);
      }
      return pairs;
    }

    }

    function extractBalancedJsonObject(text) {
      const start = text.indexOf("{");
      if (start === -1) {
        return null;
      }
      let depth = 0;
      let inStr = false;
      let esc = false;
      for (let i = start; i < text.length; i += 1) {
        const c = text[i];
        if (inStr) {
          if (esc) {
            esc = false;
          } else if (c === "\\") {
            esc = true;
          } else if (c === "\"") {
            inStr = false;
          }
          continue;
        }
        if (c === "\"") {
          inStr = true;
          continue;
        }
        if (c === "{") {
          depth += 1;
        } else if (c === "}") {
          depth -= 1;
          if (depth === 0) {
            return text.slice(start, i + 1);
          }
        }
      }
      return null;
    }

    function sanitizeAiJsonNoise(source) {
      if (!source || typeof source !== "string") {
        return source;
      }
      return source
        .replace(/[\u201c\u201d\u2018\u2019]/g, (ch) => {
          if (ch === "\u201c" || ch === "\u201d") {
            return '"';
          }
          return "'";
        })
        .split(/\r?\n/)
        .filter((line) => {
          const t = line.trim();
          if (t === "..." || t === "...," || t === "...;" || t === "...}") {
            return false;
          }
          if (/^\.{3,}\s*(?:[,;]|\})?\s*$/.test(t)) {
            return false;
          }
          if (/^[…．]+\s*(?:[,;]|\})?\s*$/.test(t)) {
            return false;
          }
          return true;
        })
        .join("\n")
        .replace(/,\s*([}\]])/g, "$1");
    }

    function repairTruncatedJsonObject(text) {
      const start = text.indexOf("{");
      if (start === -1) {
        return null;
      }
      let slice = text.slice(start);
      slice = sanitizeAiJsonNoise(slice);
      const stack = [];
      let inStr = false;
      let esc = false;
      for (let i = 0; i < slice.length; i += 1) {
        const c = slice[i];
        if (inStr) {
          if (esc) {
            esc = false;
          } else if (c === "\\") {
            esc = true;
          } else if (c === '"') {
            inStr = false;
          }
          continue;
        }
        if (c === '"') {
          inStr = true;
          continue;
        }
        if (c === "{" || c === "[") {
          stack.push(c);
        } else if (c === "}") {
          if (stack[stack.length - 1] === "{") {
            stack.pop();
          }
        } else if (c === "]") {
          if (stack[stack.length - 1] === "[") {
            stack.pop();
          }
        }
      }
      if (inStr) {
        slice += '"';
      }
      slice = slice.replace(/,\s*$/, "");
      while (stack.length) {
        const open = stack.pop();
        slice += open === "{" ? "}" : "]";
      }
      return slice;
    }

    function extractSseDeltaPieces(json) {
      if (!json || typeof json !== "object") {
        return { content: "", reasoning: "" };
      }
      if (json.message && typeof json.message === "object") {
        return {
          content: typeof json.message.content === "string" ? json.message.content : "",
          reasoning:
            typeof json.message.reasoning_content === "string"
              ? json.message.reasoning_content
              : typeof json.message.reasoning === "string"
                ? json.message.reasoning
                : "",
        };
      }
      const c0 = json.choices && json.choices[0];
      if (!c0) {
        return { content: "", reasoning: "" };
      }
      const d = c0.delta || {};
      const msg = c0.message || {};
      const content =
        (typeof d.content === "string" ? d.content : "") ||
        (typeof msg.content === "string" ? msg.content : "") ||
        (typeof c0.text === "string" ? c0.text : "");
      const reasoning =
        (typeof d.reasoning_content === "string" ? d.reasoning_content : "") ||
        (typeof d.reasoning === "string" ? d.reasoning : "") ||
        (typeof d.thinking === "string" ? d.thinking : "") ||
        (typeof msg.reasoning_content === "string" ? msg.reasoning_content : "") ||
        (typeof msg.reasoning === "string" ? msg.reasoning : "");
      return { content: content || "", reasoning: reasoning || "" };
    }

    function extractSseAssistantText(json) {
      const parts = extractSseDeltaPieces(json);
      return parts.content || parts.reasoning || "";
    }

    function mergeStreamAssistantText(content, reasoning) {
      const c = String(content || "").trim();
      const r = String(reasoning || "").trim();
      if (c && c.indexOf("{") >= 0) {
        return c;
      }
      if (r && r.indexOf("{") >= 0) {
        return r;
      }
      if (c && r) {
        return c + "\n" + r;
      }
      return c || r;
    }

    function supportsJsonResponseFormat(modelId) {
      const m = String(modelId || "").toLowerCase();
      if (/deepseek-r1|reasoner|qwq|r1\b|thinking/.test(m)) {
        return false;
      }
      return /deepseek|gpt-4|gpt-3|qwen|glm|moonshot|kimi/.test(m);
    }

    function extractSseFinishReason(json) {
      const c0 = json && json.choices && json.choices[0];
      if (!c0) {
        return "";
      }
      return String(c0.finish_reason || (c0.delta && c0.delta.finish_reason) || "");
    }

    function maxTokensForModel(model) {
      const m = String(model || "").toLowerCase();
      if (m.indexOf("deepseek-r1") !== -1) {

      }
      if (m.indexOf("qwen") !== -1) {
        return 98304;
      }
      return 131072;
    }

    function parseAIJson(content) {
      let raw = (content || "").trim();
      if (!raw) {
        throw new Error(
          "AI 未返回内容（流式正文为空）。若使用 DeepSeek 推理/Reasoner 模型，请换 deepseek-chat，或查看日志是否 0 片段。"
        );
      }
      const thinkOpen = String.fromCharCode(60, 116, 104, 105, 110, 107, 62);
      raw = raw.replace(new RegExp(thinkOpen + "[\\s\\S]*?<\\/think>", "gi"), "").trim();
      raw = raw.replace(/<think>[\s\S]*?<\/redacted_thinking>/gi, "").trim();
      raw = raw.replace(/<redacted_reasoning>[\s\S]*?<\/redacted_reasoning>/gi, "").trim();
      const fenceMatch = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
      const fenced = fenceMatch ? fenceMatch[1].trim() : "";
      let jsonText = sanitizeAiJsonNoise(fenced && fenced.indexOf("{") >= 0 ? fenced : raw);
      const tryParse = (s) => {
        try {
          return JSON.parse(s);
        } catch (e) {
          return null;
        }
      };
      let parsed = tryParse(jsonText);
      if (Array.isArray(parsed)) {
        return parsed;
      }
      if (!parsed) {
        parsed = tryParse(sanitizeAiJsonNoise(jsonText));
      }
      if (Array.isArray(parsed)) {
        return parsed;
      }
      if (parsed) {
        return parsed;
      }
      const repaired = repairTruncatedJsonObject(jsonText);
      if (repaired) {
        parsed = tryParse(repaired);
        if (!parsed) {
          parsed = tryParse(sanitizeAiJsonNoise(repaired));
        }
        if (parsed) {
          return parsed;
        }
      }
      const balanced = extractBalancedJsonObject(jsonText);
      if (balanced) {
        parsed = tryParse(balanced);
        if (!parsed) {
          parsed = tryParse(sanitizeAiJsonNoise(balanced));
        }
        if (parsed) {
          return parsed;
        }
        const errHint = balanced.length > 800 ? balanced.slice(0, 800) + "..." : balanced;
        throw new Error("JSON.parse 失败（括号平衡截取）。片段：" + errHint);
      }
      const start = jsonText.indexOf("{");
      const arrStart = jsonText.indexOf("[");
      if (start === -1 && arrStart !== -1) {
        const arrEnd = jsonText.lastIndexOf("]");
        if (arrEnd > arrStart) {
          parsed = tryParse(jsonText.slice(arrStart, arrEnd + 1));
          if (Array.isArray(parsed)) {
            return parsed;
          }
        }
      }
      const end = jsonText.lastIndexOf("}");
      if (start !== -1 && end > start) {
        const slice = jsonText.slice(start, end + 1);
        parsed = tryParse(slice);
        if (!parsed) {
          parsed = tryParse(sanitizeAiJsonNoise(slice));
        }
        if (parsed) {
          return parsed;
        }
        const errHint = slice.length > 800 ? slice.slice(0, 800) + "..." : slice;
        throw new Error("JSON.parse 失败（已截取首段对象）。片段：" + errHint);
      }
      const hint = jsonText.length > 600 ? jsonText.slice(0, 600) + "..." : jsonText;
      throw new Error(
        "未找到可解析的 JSON 对象。原始开头：" +
          (hint || "（空）") +
          "。若日志显示 0 片段，多为模型把输出放在 reasoning 通道或上游未返回 delta。"
      );
    }

    async function fetchOpenAiChatOnce(apiUrl, apiKey, reqBody, signal) {
      const body = Object.assign({}, reqBody, { stream: false });
      delete body.stream;
      const response = await fetch(apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + apiKey,
        },
        body: JSON.stringify(body),
        signal: signal,
      });
      if (!response.ok) {
        const errText = await response.text();
        throw new Error("非流式重试失败：" + response.status + " " + errText.slice(0, 400));
      }
      const json = await response.json();
      const c0 = json.choices && json.choices[0];
      if (!c0) {
        return "";
      }
      const msg = c0.message || {};
      return mergeStreamAssistantText(
        typeof msg.content === "string" ? msg.content : "",
        typeof msg.reasoning_content === "string"
          ? msg.reasoning_content
          : typeof msg.reasoning === "string"
            ? msg.reasoning
            : ""
      );
    }

      if (!doc || !doc.documentElement) {

        styleEl = doc.createElement("style");
        styleEl.id = "lp-readable-style";
        (doc.head || doc.documentElement).appendChild(styleEl);
      }
      if (mode === "export") {
        styleEl.textContent =
          "body{background:#ffffff!important;color:#000000!important;}" +
          "table,td,th,p,font,span,div{color:#000000!important;background-color:transparent!important;}" +
          "font[color]{color:#000000!important;}";
      } else {
        styleEl.textContent = "body{background:#ffffff!important;color:#000000!important;}";
      }
      doc.querySelectorAll("script").forEach(function (n) {
        n.remove();
      });
      doc.querySelectorAll('link[rel="stylesheet"]').forEach(function (n) {
        n.remove();
      });
    }

        }

          statusBox.textContent = "教案内容为空，请先完成 AI 生成或检查回填是否成功";
        }
        return;

      const wrapped = htmlForDocExport(generatedHtml);
      const hx =
        typeof htmlDocx !== "undefined"
          ? htmlDocx
          : typeof window !== "undefined" && window.htmlDocx
            ? window.htmlDocx
            : null;
      try {
        if (typeof saveAs !== "undefined" && hx && typeof hx.asBlob === "function") {
          saveAs(hx.asBlob(wrapped), "教案.docx");
          openPreviewMotion();
          openPanelMotion();
          return;
        }
      } catch (e) {
        console.error(e);
      }
      try {
        const d = new DOMParser().parseFromString(wrapped, "text/html");
        const inner = d.body ? d.body.innerHTML : wrapped;
        const docHtml =
          "\ufeff<html xmlns:w=\"urn:schemas-microsoft-com:office:word\"><head><meta charset=\"utf-8\">" +
          "<style>body,table,td,p,font{color:#000;background:#fff;}</style></head><body>" +
          inner +
          "</body></html>";
        const blob = new Blob([docHtml], { type: "application/msword" });
        if (typeof saveAs !== "undefined") {
          saveAs(blob, "教案.doc");
        } else {
          const u = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = u;
          a.download = "教案.doc";
          a.click();
          URL.revokeObjectURL(u);

    function maxTokensForLessonBatch(model, lessonCount, includeGlobal) {
      const cap = maxTokensForModel(model);
      if (includeGlobal) {
        return cap;

      // 第 2 课及以后每课单独请求时不含 global，但 JSON 体量与第 1 课相近；此前用 ~20k 易截断 processBlocks 尾部。
      const est = 6500 * Math.max(1, lessonCount) + 12000;
      return Math.min(cap, Math.max(64000, est));
    }

    function describeHttpNetworkError(err, url) {
      const raw = String(err && err.message ? err.message : err || "");
      const name = String(err && err.name ? err.name : "");
      const blob = (name + " " + raw).toLowerCase();
      if (/networkerror|failed to fetch|load failed|network error|ecconnreset|econnreset/i.test(blob)) {
        return (
          "网络异常：无法连接服务器或流式传输中途断开。请依次排查：① 页面与接口是否同为 HTTPS；② Nginx/反代是否关闭响应缓冲并放宽读超时；③ 教案 AI 接口与模型上游是否正常；④ 本机网络/VPN。请求：" +
          url
        );
      }
      return raw || name || String(err);
    }

    async function streamOpenAiChat(apiUrl, apiKey, reqBody, signal, onChunkProgress) {
      let response;
      try {
        response = await fetch(apiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + apiKey
          },
          body: JSON.stringify(reqBody),
          signal: signal
        });
      } catch (e) {
        throw new Error(describeHttpNetworkError(e, apiUrl));
      }
      if (!response.ok) {
        const errText = await response.text();
        throw new Error("接口返回状态码：" + response.status + "，详情：" + errText);
      }
      if (!response.body) {
        throw new Error("浏览器不支持流式读取，或服务端未返回流。");
      }
      const reader = response.body.getReader();
      streamReader = reader;
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      let content = "";
      let reasoning = "";
      let chunkCount = 0;
      let finishReason = "";
      function processSseLine(line) {
        const t = line.trim();
        if (!t || !t.startsWith("data:")) {
          return;
        }
        const dataPart = t.slice(5).trim();
        if (dataPart === "[DONE]") {
          appendLog("[流] 完成" + (finishReason ? "（" + finishReason + "）" : ""));
          return;
        }
        try {
          const json = JSON.parse(dataPart);
          const reason = extractSseFinishReason(json);
          if (reason) {
            finishReason = reason;
          }
          const pieces = extractSseDeltaPieces(json);
          if (pieces.content) {
            content += pieces.content;
            chunkCount += 1;
          }
          if (pieces.reasoning) {
            reasoning += pieces.reasoning;
            chunkCount += 1;
          }
          if (pieces.content || pieces.reasoning) {
            if (chunkCount % 8 === 0) {
              appendLog("[流] 已接收片段 " + chunkCount);
            }
            if (typeof onChunkProgress === "function") {
              onChunkProgress(chunkCount);
            }
          }
        } catch (e) {
          appendLog("[警告] 非 JSON 流片段，已跳过");
        }
      }
      while (true) {
        let chunk;
        try {
          chunk = await reader.read();
        } catch (e) {
          streamReader = null;
          throw new Error(describeHttpNetworkError(e, apiUrl));
        }
        const { value, done } = chunk;
        if (done) {
          buffer += decoder.decode();
          break;
        }
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split(/\r?\n/);
        buffer = lines.pop() || "";
        for (const rawLine of lines) {
          processSseLine(rawLine);
        }
      }
      if (buffer.trim()) {
        buffer.split(/\r?\n/).forEach(processSseLine);
      }
      streamReader = null;
      if (finishReason === "length") {
        appendLog("[警告] 模型输出因 max_tokens 达到上限被截断，请提高后台「教案 max_tokens」或换更大上下文模型。");
      }
      const merged = mergeStreamAssistantText(content, reasoning);
      if (!merged) {
        appendLog(
          "[警告] 流式正文为空（content=" +
            content.length +
            " 字，reasoning=" +
            reasoning.length +
            " 字，片段 " +
            chunkCount +
            "）。"
        );
      } else if (reasoning && (!content || content.indexOf("{") < 0) && merged.indexOf("{") >= 0) {
        appendLog("[系统] JSON 来自 reasoning 通道（DeepSeek Reasoner 等模型常见）");
      }
      return merged;
    }

    function pickLessonAiForPair(list, pairIndex, wantNo, totalPairs, singletonLessonNoHint) {
      if (!Array.isArray(list) || list.length === 0) {
        return null;
      }
      const byNo = list.find((it) => it && Number(it.lessonNo) === wantNo);
      if (byNo) {
        return byNo;
      }
      if (list.length === 1 && list[0]) {
        const only = list[0];
        const m = Number(only.lessonNo);
        if (Number.isFinite(m) && m > 0) {
          return m === wantNo ? only : null;
        }
        if (singletonLessonNoHint != null && wantNo === singletonLessonNoHint) {
          return only;
        }
        return totalPairs === 1 ? only : null;
      }
      const cand = list[pairIndex];
      if (!cand) {
        return null;
      }
      const rawNo = cand.lessonNo;
      const n = Number(rawNo);
      if (rawNo === undefined || rawNo === null || String(rawNo).trim() === "" || !Number.isFinite(n) || n < 1) {
        return cand;
      }
      if (list.length === totalPairs) {
        return cand;
      }
      return null;
    }

    function applyAiDataToDoc(aiData, applyGlobal, applyLessonNos) {
      if (!generatedHtml) {
        return;
      }
      const parser = new DOMParser();
      const sourceHtml = generatedHtml;
      const doc = parser.parseFromString(sourceHtml, "text/html");
      ensureTableGridLines(doc);
      const pairs = ensureDetailedPairs(doc, lessons.length);
      if (applyGlobal && aiData.global && Object.keys(aiData.global).length > 0) {
        setGlobalByAI(doc, aiData.global);
      }
      const list = aiData.lessons || [];
      const nPairs = pairs.length;
      const onlyNos =
        Array.isArray(applyLessonNos) && applyLessonNos.length > 0
          ? new Set(applyLessonNos.map((x) => Number(x)).filter((x) => Number.isFinite(x) && x > 0))
          : null;
      const singletonHint =
        list.length === 1 && onlyNos && onlyNos.size === 1 ? [...onlyNos][0] : null;
      const missingNos = [];
      for (let i = 0; i < nPairs; i += 1) {
        const wantNo = i + 1;
        if (onlyNos && !onlyNos.has(wantNo)) {
          continue;
        }
        const lessonAI = pickLessonAiForPair(list, i, wantNo, nPairs, singletonHint);
        if (lessonAI) {
          setLessonRedCellsByAI(pairs[i], lessonAI);
        } else {
          missingNos.push(String(wantNo));
        }
      }
      if (missingNos.length > 0) {
        appendLog(
          "[警告] 以下课次未回填：" +
            missingNos.join("、") +
            "（模型返回 lessons 共 " +
            list.length +
            " 条" +
            (onlyNos ? "，本批次仅应写入课次 " + [...onlyNos].sort((a, b) => a - b).join("、") : "") +
            "）。可尝试：提高 max_tokens、换模型，或检查该课 JSON 是否被截断。"
        );
      }
      generatedHtml = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
      setPreviewHtml(generatedHtml);
      surgePreview();
      openPreviewMotion();
      openPanelMotion();
    }

    function parseDirectoryPaste(text) {
      const lines = (text || "")
        .split(/\r?\n/)
        .map((ln) => ln.replace(/\u00a0/g, " ").trim());
      let courseName = "";
      let examRaw = "";
      let courseCode = "";
      let className = "";
      const labels = new Set(["课程名称", "考试方式", "课程代码", "授课班级"]);
      for (let i = 0; i < lines.length; i++) {
        const L = lines[i];
        if (!labels.has(L)) {
          continue;
        }
        if (i + 1 >= lines.length) {
          break;
        }
        const v = lines[i + 1];
        if (L === "课程名称") {
          courseName = v;
        }
        if (L === "考试方式") {
          examRaw = v;
        }
        if (L === "课程代码") {
          courseCode = v;
        }
        if (L === "授课班级") {
          className = v;
        }
        i++;
      }
      const topics = [];
      const re3 = /^\d+\.\d+\.\d+\s+.+/;
      for (let j = 0; j < lines.length; j++) {
        const L = lines[j];
        if (re3.test(L)) {
          topics.push(L);
        }
      }
      if (topics.length === 0) {
        const re2 = /^\d+\.\d+\s+.+/;
        for (let j = 0; j < lines.length; j++) {
          const L = lines[j];
          if (re2.test(L) && !/^\d+\.\d+\.\d+/.test(L)) {
            topics.push(L);
          }
        }
      }
      const maxLessons = 100;
      return {
        courseName,
        examRaw,
        courseCode,
        className,
        topics: topics.slice(0, maxLessons)
      };
    }

    btnRunAI.addEventListener("click", async () => {
      const apiUrl = DEFAULT_API_URL;

      const opt = modelNameInput.selectedOptions[0];
      if (!opt || !opt.value) {
        appendLog("[模型] 请先选择模型（若列表为空请在后台配置或导入 SQL）。");
        if (statusBox) {
          statusBox.textContent = "";

      collectLessonsFromUI();
      const fullPayload = collectPayloadForAI();
      fullPayload.model = opt.value;
      const modelId = fullPayload.model;
      const lessonTotal = fullPayload.lessons.length;
      if (lessonTotal < 1) {
        appendLog("[错误] 没有课次，请先添加课次。");
        return;
      }

      const batches = [];
      for (let start = 0; start < lessonTotal; start += 1) {
        batches.push({ start, end: start + 1 });
      }

      streamReader = null;
      aiAbortController = new AbortController();
      if (btnAbortAI) {
        btnAbortAI.style.display = "inline-block";
      }
      btnRunAI.disabled = true;
      lpAiRunning = true;
      notifyParent({ running: true, done: false, progress: 3, message: "AI 生成已开始，可挂起" });
      if (statusBox) {
        statusBox.textContent = "";
      }
      if (logBox) {
        logBox.textContent = "[系统] 开始生成...\n";
      }
      appendLog(
        "[系统] 共 " +
          lessonTotal +
          " 次请求（每课次 1 次" +
          (scopeOnlyLessons ? "" : "，第 1 次含整体教学设计") +
          "），每课次消耗 1 次对话额度。"
      );
      openPanelMotion();
      setProgress(3);

      const mid = parseInt(opt.dataset.llmModelId || "0", 10);
      const pid = parseInt(opt.dataset.providerId || "0", 10);
      const mtStr = opt.dataset.maxTokens;

      try {
        if (!generatedHtml) {
          appendLog("[系统] 预生成模板");
          await generate();
        }
        if (!generatedHtml) {
          throw new Error("模板未生成，无法回填。");
        }

        let stoppedEarly = false;
        for (let bi = 0; bi < batches.length; bi += 1) {
          if (aiAbortController.signal.aborted) {
            appendLog("[系统] 已中断");
            stoppedEarly = true;
            break;
          }
          const { start, end } = batches[bi];
          const sliceLessons = fullPayload.lessons.slice(start, end);
          const subPayload = {
            model: fullPayload.model,
            courseName: fullPayload.courseName,
            courseCode: fullPayload.courseCode,
            examType: fullPayload.examType,
            className: fullPayload.className,
            lessons: sliceLessons
          };

          const firstBatch = bi === 0;
          const lessonsOnlyPrompt = scopeOnlyLessons || (!scopeOnlyLessons && !firstBatch);
          const includeGlobalThisBatch = !scopeOnlyLessons && firstBatch;

          const systemPrompt = buildAiSystemPrompt(modelId, lessonsOnlyPrompt);
          const userPrompt = lessonsOnlyPrompt
            ? buildLessonsOnlyUserPrompt(subPayload)
            : buildFullModeUserPrompt(subPayload);

          let maxTok = maxTokensForLessonBatch(modelId, sliceLessons.length, includeGlobalThisBatch);
          if (mtStr) {
            const mtCap = parseInt(mtStr, 10);
            if (mtCap > 0) {
              maxTok = Math.min(maxTok, mtCap);
            }
          }
          maxTok = Math.max(maxTok, includeGlobalThisBatch ? 32768 : 16384);

          appendLog("[系统] max_tokens=" + maxTok);
          const reqBody = {
            model: fullPayload.model,
            temperature: 0.4,
            max_tokens: maxTok,
            stream: true,
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: userPrompt }
            ]
          };
          if (supportsJsonResponseFormat(modelId)) {
            reqBody.response_format = { type: "json_object" };
          }
          if (mid > 0) {
            reqBody.llm_model_id = mid;
          } else if (pid > 0) {
            reqBody.provider_id = pid;
          }

          const lessonLabel = sliceLessons[0] && sliceLessons[0].topic ? sliceLessons[0].topic : "课次 " + (start + 1);
          appendLog(
            "[系统] 第 " +
              (bi + 1) +
              "/" +
              batches.length +
              " 课（第 " +
              (start + 1) +
              " 次课：" +
              lessonLabel +
              (includeGlobalThisBatch ? "，含整体教学设计" : "，仅本课学时详细教案") +
              "）"
          );

          const batchProgBase = 5 + (bi / batches.length) * 82;
          setProgress(Math.floor(batchProgBase));

          let content = await streamOpenAiChat(apiUrl, apiKey, reqBody, aiAbortController.signal, (chunkCount) => {
            setProgress(Math.min(97, Math.floor(batchProgBase + Math.min(18, chunkCount / 4))));
          });
          if (!content || content.indexOf("{") < 0) {
            appendLog("[系统] 流式未得到有效 JSON，尝试非流式重试…");
            content = await fetchOpenAiChatOnce(apiUrl, apiKey, reqBody, aiAbortController.signal);
          }
          refreshLessonQuota();

          appendLog("[系统] 解析 JSON（第 " + (bi + 1) + " 课）");
          const rawParsed = parseAIJson(content);
          const aiData = coerceAiRoot(rawParsed);
          if (!aiData.lessons || aiData.lessons.length === 0) {
            throw new Error("第 " + (bi + 1) + " 课未解析到 lessons");
          }
          if (aiData.lessons.length < sliceLessons.length) {
            appendLog(
              "[警告] 第 " +
                (bi + 1) +
                " 课模型只返回 " +
                aiData.lessons.length +
                " 条 lessons（本请求 1 课），回填可能不完整。"
            );
          }

          applyAiDataToDoc(
            aiData,
            includeGlobalThisBatch,
            sliceLessons
              .map((l) => Number(l && l.lessonNo))
              .filter((n) => Number.isFinite(n) && n > 0)
          );
        }

        if (!stoppedEarly) {
          setProgress(100);
          appendLog("[系统] 生成回填完成");
          runConfettiCelebrate();
          notifyParent({ running: false, done: true, progress: 100, message: "生成完成，可导出 docx" });
        }
        if (statusBox) {
          statusBox.textContent = "";
        }
      } catch (error) {
        if (error && (error.name === "AbortError" || /aborted/i.test(String(error.message || "")))) {
          appendLog("[系统] 已中断");
          notifyParent({ running: false, done: false, progress: 0, message: "已中断生成" });
          if (statusBox) {
            statusBox.textContent = "";
          }
          return;
        }
        setProgress(0);
        appendLog("[错误] " + (error && error.message ? error.message : String(error)));
        notifyParent({
          running: false,
          done: false,
          progress: 0,
          message: error && error.message ? error.message : "生成失败",
        });
        console.error(error);
        if (statusBox) {
          statusBox.textContent = "";
        }
      } finally {
        streamReader = null;
        aiAbortController = null;
        lpAiRunning = false;
        btnRunAI.disabled = false;
        if (btnAbortAI) {
          btnAbortAI.style.display = "none";
        }
        saveLessonState();
      }
    });

    if (btnAbortAI) {
      btnAbortAI.addEventListener("click", () => {
        if (streamReader) {
          try {
            streamReader.cancel();
          } catch (e) {
            void 0;
          }
          streamReader = null;
        }
        if (aiAbortController) {
          aiAbortController.abort();
        }
        appendLog("[系统] 已请求中断");
        if (statusBox) {
          statusBox.textContent = "";
        }
      });
    }

    document.addEventListener(
      "click",
      (ev) => {
        const el = ev.target;
        if (!(el instanceof Element)) {
          return;
        }
        const btn = el.closest("button");
        if (!btn || btn.disabled) {
          return;
        }
        btn.classList.remove("motion-btn-press");
        void btn.offsetWidth;
        btn.classList.add("motion-btn-press");
      },
      true
    );

    async function refreshLessonQuota() {
      const host = document.getElementById("lesson-plan-quota");
      const url = cfg.quotaApiUrl;
      if (!host || !url) return;
      try {
        const r = await fetch(url, { credentials: "same-origin" });
        const j = await r.json();
        const chat = j && j.chat ? j.chat : null;
        if (!chat) {
          host.textContent = "";
          return;
        }
        if (chat.remaining == null) {
          host.textContent = "对话额度：不限";
        } else {
          host.textContent = "对话额度：剩余 " + chat.remaining + " / " + chat.limit;
        }
      } catch (e) {
        host.textContent = "";
      }
    }

    loadModelsFromServer();
    refreshLessonQuota();
    restoreLessonState();
    setStep(lpCurrentStep || 1, true);
    renderLessonList();

    if (generatedHtml && window.parent && window.parent !== window) {
      notifyParent({ running: false, done: true, progress: 100, message: "生成完成，可导出 docx" });
    }

    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: "campus-lesson-plan", type: "ready" }, window.location.origin);
      }
    } catch (e) {}

    document.querySelector(".container")?.addEventListener(
      "input",
      function () {
        saveLessonState();
      },
      true
    );
  </script>
</body>
</html>
